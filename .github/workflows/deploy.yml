name: Deploy to GitHub Pages

on:
  push:
    branches: [xiangqi-vision]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # pull the LFS-tracked ONNX model so it ships in the build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Enable + read the repo's Pages config. `enablement: true` auto-creates
      # the Pages site, but ONLY if the repo's Actions token may write Pages
      # (Settings -> Actions -> General -> Workflow permissions: Read and write).
      # Alternatively, enable Pages once via Settings -> Pages -> Source: GitHub
      # Actions, which also satisfies this step.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
